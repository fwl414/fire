# 多副本负载均衡配置（配合 deploy/docker-compose.scale.yml）
#
# 与单实例的 nginx.conf 的唯一区别：用 Docker 内嵌 DNS 动态解析 service 名，
# 这样新扩出来的副本会被自动纳入轮询；否则 nginx 启动时只缓存一个 IP，扩副本不生效。
#
# 注意：使用变量形式的 proxy_pass 时，nginx 会把请求 URI 原样转发，
# 因此这里不再写 `proxy_pass http://backend:8000/api/` 这类路径替换。

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Docker 内嵌 DNS：service 名会解析成该服务的所有副本 IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # 指标端点不对外暴露；多副本时 Prometheus 需按副本分别抓取（见 README）
    location = /metrics {
        deny all;
        return 403;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报表异步导出等长任务不会占住连接，但探测/云台下发可能较慢
        proxy_read_timeout 120s;
    }

    # WebSocket：连接建立后固定落在某一个副本上。
    # 多副本下该副本产生的通知能送达，其他副本产生的通知不会跨实例广播（见 README 已知限制）。
    location /ws/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; connect-src 'self' https: ws: wss:; frame-ancestors 'none';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
