# 多实例（水平扩展）编排：backend 多副本 + nginx 负载均衡
#
# 与 docker-compose.yml（单实例）并存，不互相覆盖。使用方式：
#   docker compose -f deploy/docker-compose.scale.yml --env-file .env up -d --build
#   docker compose -f deploy/docker-compose.scale.yml --env-file .env up -d --scale backend=3
#
# 验证负载均衡是否生效（instance_id 应轮换）：
#   for i in 1 2 3 4; do curl -s http://127.0.0.1/health | grep instance_id; done
#
# 说明：本文件不设置 container_name，副本名由 compose 自动生成，这样 --scale 才能工作。
# 若沿用生产命名规范，请传 -p <CONTAINER_PREFIX> 指定项目名。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fire_ai_agent}
      - POSTGRES_USER=${POSTGRES_USER:-fire}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fire} -d ${POSTGRES_DB:-fire_ai_agent}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - fire_ai_network

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fire-ai-agent-backend:${IMAGE_TAG:-latest}
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - METRICS_TOKEN=${METRICS_TOKEN:?METRICS_TOKEN must be set}
      - DEMO_MODE=false
      - DEBUG=false
      - LOG_LEVEL=info
      - LOG_FILE=/tmp/fire-ai-agent.log
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # 单容器内并行度；多副本时保持 1 即可，由副本数提供扩展
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      # 每副本独立的上传/报表目录（作为本地缓存），跨实例读取由对象存储兜底
      - UPLOAD_STORAGE_DIR=/var/lib/fire-ai/uploads
      - REPORT_STORAGE_DIR=/var/lib/fire-ai/reports
      - RUNTIME_DB_PATH=/var/lib/fire-ai/runtime/fire_agent_runtime.db
      - BACKUP_DIR=/var/lib/fire-ai/backups
      # 对象存储：多副本必须启用，否则 A 副本上传的文件 B 副本读不到
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_PREFIX=${S3_PREFIX:-fire-ai}
      - S3_PATH_STYLE=${S3_PATH_STYLE:-true}
      - S3_VERIFY_TLS=${S3_VERIFY_TLS:-true}
      # 后台任务队列：各副本共用一个队列，领取是原子的，不会重复执行
      - TASK_WORKER_ENABLED=true
      # 设备 MQTT：多副本需配置共享订阅组，否则每个副本都会收到同一条消息
      - MQTT_ENABLED=${MQTT_ENABLED:-false}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_USE_TLS=${MQTT_USE_TLS:-false}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-fire}
      - MQTT_SHARED_GROUP=${MQTT_SHARED_GROUP:-fire-ai}
    # 备份等"只应一处执行"的动作由 RuntimeLock 保证，见 README
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 单主机多副本：这些目录必须**共享**（同一主机文件系统上 SQLite 的文件锁可用），
      # 否则各副本会各写一份数据导致分叉。跨主机部署时改用对象存储 + 把运行时库迁到主库。
      - runtime_data:/var/lib/fire-ai/runtime
      - uploads_data:/var/lib/fire-ai/uploads
      - reports_data:/var/lib/fire-ai/reports
      - backups_data:/var/lib/fire-ai/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - fire_ai_network

  frontend:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 多副本用带 Docker DNS 解析的配置，逐请求轮询所有 backend 副本
      - ./nginx.scale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - fire_ai_network

networks:
  fire_ai_network:
    driver: bridge

volumes:
  postgres_data:
  runtime_data:
  uploads_data:
  reports_data:
  backups_data:
