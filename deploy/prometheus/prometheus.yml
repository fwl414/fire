# Prometheus 抓取配置（模板：__METRICS_TOKEN__ 由容器启动脚本替换为真实令牌）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: fire-ai-agent
    env: production

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'fire-ai-backend'
    metrics_path: /metrics
    params:
      token: ['__METRICS_TOKEN__']
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
