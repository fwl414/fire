# staging 环境叠加编排（与生产同镜像、独立端口与配置，用于上线前验收）
#
# 启动：
#   cp .env.staging.example .env.staging && 填写其中的必填项
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml \
#       --env-file .env.staging -p fire_staging up -d --build
#
# 验收：curl -f http://127.0.0.1:8080/health && curl -f http://127.0.0.1:8080/ready
# 停止：docker compose -f docker-compose.yml -f docker-compose.staging.yml -p fire_staging down

services:
  backend:
    image: fire-ai-agent-backend:${IMAGE_TAG:-staging}
    environment:
      # staging 使用独立库，禁止生成演示账号，日志更详细便于排查
      - ENV=development
      - DEMO_MODE=false
      - DEBUG=true
      - LOG_LEVEL=debug
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:8080}
      - BACKUP_RETENTION_DAYS=3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  postgres:
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fire_ai_agent_staging}

  frontend:
    ports:
      - "${HTTP_PORT:-8080}:80"
