# 智慧消防系统（Python 后端）生产编排：单机 Docker Compose + PostgreSQL
#
# 使用方式：
#   1) cp .env.example .env 并按需填写（DATABASE_URL / JWT_SECRET_KEY / METRICS_TOKEN 必填）
#   2) 准备 TLS 证书到 ./certs（fullchain.pem / privkey.pem），见 deploy/certbot/README.md
#   3) docker compose build && docker compose up -d
#   4) 健康检查：curl -f https://127.0.0.1/health && curl -f https://127.0.0.1/ready
#
# 发布与回滚见 README「生产部署与回滚」章节，或使用 scripts/release.sh / scripts/rollback.sh。

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-fire_ai}_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fire_ai_agent}
      - POSTGRES_USER=${POSTGRES_USER:-fire}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fire} -d ${POSTGRES_DB:-fire_ai_agent}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - fire_ai_network

  backend:
    build: .
    image: fire-ai-agent-backend:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX:-fire_ai}_backend
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - METRICS_TOKEN=${METRICS_TOKEN:?METRICS_TOKEN must be set}
      - DEMO_MODE=false
      - DEBUG=false
      - LOG_LEVEL=info
      - LOG_FILE=/tmp/fire-ai-agent.log
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # 可写数据卷（根文件系统只读，以下路径必须挂卷）
      - UPLOAD_STORAGE_DIR=/var/lib/fire-ai/uploads
      - REPORT_STORAGE_DIR=/var/lib/fire-ai/reports
      - RUNTIME_DB_PATH=/var/lib/fire-ai/runtime/fire_agent_runtime.db
      - BACKUP_DIR=/var/lib/fire-ai/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      # 设备 MQTT 接入（未启用时留空即可）
      - MQTT_ENABLED=${MQTT_ENABLED:-false}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_USE_TLS=${MQTT_USE_TLS:-false}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-fire}
      # GB/T 26875 消防主机（用户信息传输装置）接入
      - GB26875_ENABLED=${GB26875_ENABLED:-false}
      - GB26875_LISTEN_HOST=${GB26875_LISTEN_HOST:-0.0.0.0}
      - GB26875_LISTEN_PORT=${GB26875_LISTEN_PORT:-5016}
      - GB26875_CENTER_ADDRESS=${GB26875_CENTER_ADDRESS:-000000000000}
      # GB28181 视频接入（SIP 信令在本容器，媒体流走 zlmediakit 容器）
      - GB28181_ENABLED=${GB28181_ENABLED:-false}
      - GB28181_SIP_LISTEN_HOST=${GB28181_SIP_LISTEN_HOST:-0.0.0.0}
      - GB28181_SIP_LISTEN_PORT=${GB28181_SIP_LISTEN_PORT:-5060}
      - GB28181_SIP_SERVER_ID=${GB28181_SIP_SERVER_ID:-34020000002000000001}
      - GB28181_SIP_DOMAIN=${GB28181_SIP_DOMAIN:-3402000000}
      - GB28181_SIP_PASSWORD=${GB28181_SIP_PASSWORD:-}
      - GB28181_SIP_ADVERTISE_HOST=${GB28181_SIP_ADVERTISE_HOST:-}
      - GB28181_MEDIA_API_BASE=${GB28181_MEDIA_API_BASE:-}
      - GB28181_MEDIA_SECRET=${GB28181_MEDIA_SECRET:-}
      - GB28181_MEDIA_HTTP_HOST=${GB28181_MEDIA_HTTP_HOST:-}
      - GB28181_MEDIA_HTTP_PORT=${GB28181_MEDIA_HTTP_PORT:-8081}
      - GB28181_MEDIA_RTP_HOST=${GB28181_MEDIA_RTP_HOST:-}
      # 告警外部通知通道（通道配置在页面里维护并加密落库，这里只放总开关与发送参数）
      - ALERT_NOTIFY_ENABLED=${ALERT_NOTIFY_ENABLED:-true}
      - ALERT_NOTIFY_TIMEOUT_SECONDS=${ALERT_NOTIFY_TIMEOUT_SECONDS:-10}
      - ALERT_NOTIFY_MAX_ATTEMPTS=${ALERT_NOTIFY_MAX_ATTEMPTS:-3}
      # 首次部署自动创建的首个管理员（留空则不自动创建，改用 create_admin.py）
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
    ports:
      # GB/T 26875 消防主机接入端口（GB26875_ENABLED=false 时该端口无进程监听）
      - "${GB26875_LISTEN_PORT:-5016}:5016"
      # GB28181 SIP 信令端口（UDP 为主，部分设备只支持 TCP）
      - "${GB28181_SIP_LISTEN_PORT:-5060}:5060/udp"
      - "${GB28181_SIP_LISTEN_PORT:-5060}:5060/tcp"
    volumes:
      - uploads_data:/var/lib/fire-ai/uploads
      - reports_data:/var/lib/fire-ai/reports
      - runtime_data:/var/lib/fire-ai/runtime
      - backups_data:/var/lib/fire-ai/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - fire_ai_network

  frontend:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-fire_ai}_frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书（宿主机生成/续期，容器只读挂载）
      - ./certs:/etc/nginx/certs:ro
      # Let's Encrypt http-01 校验目录（与 deploy/certbot/README.md 的 webroot 路径一致）
      - ./certs/www:/var/www/certbot:ro
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - fire_ai_network

  # GB28181 媒体服务器：接收设备推送的 RTP，转 HLS / HTTP-FLV / WebRTC 给前端。
  # 信令（SIP 5060）由 backend 容器自己处理，这里只负责媒体。
  zlmediakit:
    # 官方镜像；若该 tag 拉取失败，可改用 zlmediakit/zlmediakit-master:latest
    # 或私有仓库地址（用环境变量 ZLMEDIAKIT_IMAGE 覆盖）
    image: ${ZLMEDIAKIT_IMAGE:-zlmediakit/zlmediakit:master}
    container_name: ${CONTAINER_PREFIX:-fire_ai}_zlmediakit
    environment:
      # 部分镜像支持以 [段]键=值 的形式覆盖配置；若不生效，请在挂载的配置里改
      # [api]secret，并让 backend 的 GB28181_MEDIA_SECRET 与之一致。
      - "[general]secret=${GB28181_MEDIA_SECRET:-}"
    ports:
      - "${GB28181_MEDIA_RTSP_PORT:-554}:554"       # RTSP
      - "${GB28181_MEDIA_RTMP_PORT:-1935}:1935"     # RTMP
      - "${GB28181_MEDIA_HTTP_PORT:-8081}:80"       # HTTP API + HLS/FLV
      - "8000:8000/udp"                             # WebRTC
      - "${GB28181_RTP_PORT_RANGE:-10000-10500}:${GB28181_RTP_PORT_RANGE:-10000-10500}/udp"  # RTP 收流
    volumes:
      - zlmedia_data:/opt/media/conf
    restart: unless-stopped
    networks:
      - fire_ai_network

networks:
  fire_ai_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  reports_data:
  runtime_data:
  backups_data:
  zlmedia_data:
